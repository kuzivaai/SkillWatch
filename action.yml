name: "SkillWatch Scan"
description: "Monitor AI agent skill URLs for bait-and-switch content changes"
author: "Kuziva Muzondo"

branding:
  icon: "shield"
  color: "blue"

inputs:
  files:
    description: "Space-separated list of SKILL.md, MCP config, or URL list files to monitor"
    required: true
  preset:
    description: "Ignore pattern preset (docs or none)"
    required: false
    default: "docs"
  extra-args:
    description: "Additional arguments passed to skillwatch scan"
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
      with:
        python-version: "3.12"

    - name: Install SkillWatch
      shell: bash
      run: pip install skillwatch

    - name: Restore scan database
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6
      with:
        path: ~/.skillwatch
        key: skillwatch-db-${{ hashFiles(inputs.files) }}
        restore-keys: skillwatch-db-

    - name: Add URLs
      shell: bash
      env:
        SW_FILES: ${{ inputs.files }}
      run: |
        for f in $SW_FILES; do
          if [ -f "$f" ]; then
            skillwatch add "$f" || true
          fi
        done

    - name: Scan
      shell: bash
      env:
        SW_PRESET: ${{ inputs.preset }}
        SW_EXTRA_ARGS: ${{ inputs.extra-args }}
      run: |
        skillwatch scan \
          --delay 0.5 \
          --preset "$SW_PRESET" \
          --output json \
          $SW_EXTRA_ARGS \
          | tee /tmp/skillwatch-results.json
        exit_code=${PIPESTATUS[0]}
        if [ "$exit_code" -eq 1 ]; then
          echo "::warning::SkillWatch found suspicious content changes"
        fi
        exit $exit_code

    - name: Upload results
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
      with:
        name: skillwatch-results
        path: /tmp/skillwatch-results.json
        retention-days: 30
