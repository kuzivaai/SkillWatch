[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "skillwatch"
version = "0.3.0"
description = "Monitor external URLs referenced by AI agent skills and MCP tools for bait-and-switch content changes"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [
    { name = "Kuziva Muzondo" },
]
keywords = [
    "ai-security",
    "mcp",
    "mcp-security",
    "ai-agent",
    "supply-chain-security",
    "url-monitoring",
    "bait-and-switch",
    "prompt-injection",
    "skill-security",
    "content-monitoring",
    "homoglyph-detection",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Internet :: WWW/HTTP :: Site Management",
    "Typing :: Typed",
]
dependencies = [
    "trafilatura>=2.0,<3",
    "requests>=2.32.4",
    "beautifulsoup4>=4.12",
    "pyyaml>=6.0",
    "confusable_homoglyphs>=3.3",
]

[project.urls]
Homepage = "https://github.com/kuzivaai/SkillWatch"
Repository = "https://github.com/kuzivaai/SkillWatch"
Issues = "https://github.com/kuzivaai/SkillWatch/issues"
Changelog = "https://github.com/kuzivaai/SkillWatch/blob/main/CHANGELOG.md"

[project.scripts]
skillwatch = "skillwatch.cli:main"

[project.optional-dependencies]
# Optional external anchoring (RFC 3161 timestamping). Keeps the core install
# dependency-light and fully offline; only users who want cryptographic
# anchoring need these.
anchor = [
    "rfc3161-client>=1.0",
    "cryptography>=42",
]
dev = [
    "pytest>=8.0",
    "pytest-cov",
    "responses>=0.25",
    "ruff",
    "mypy>=1.10",
    "types-PyYAML",
    "types-requests",
    "types-beautifulsoup4",
    # so the anchoring tests run in CI:
    "rfc3161-client>=1.0",
    "cryptography>=42",
]

[tool.setuptools.packages.find]
include = ["skillwatch*"]

[tool.setuptools.package-data]
skillwatch = ["data/*.pem"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"
disallow_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
warn_unused_ignores = true
strict_equality = true

[[tool.mypy.overrides]]
module = "confusable_homoglyphs.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "trafilatura.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "rfc3161_client.*"
ignore_missing_imports = true

[tool.ruff]
target-version = "py310"
line-length = 100
