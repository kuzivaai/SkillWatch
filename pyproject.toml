[build-system]
# Floors are held at the lowest release free of known advisories, not merely at
# the lowest release that works. See scripts/audit_dependency_floors.py, which
# enforces this in CI: a security tool must not permit a resolution to a
# known-vulnerable dependency.
# wheel>=0.46.2 is a security floor: 0.40.0 through 0.46.1 are affected by
# CVE-2026-24049 (GHSA-8rrh-rw8j-w5fx, CWE-22, HIGH) — arbitrary file permission
# modification via path traversal in `wheel unpack`. Found by the floor audit the
# moment `wheel` was given a bound at all; it had none before.
requires = ["setuptools>=83.0.0", "wheel>=0.46.2"]
build-backend = "setuptools.build_meta"

[project]
name = "skillwatch"
version = "0.4.1"
description = "Monitor external URLs referenced by AI agent skills and MCP tools for bait-and-switch content changes"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [
    { name = "Kuziva Muzondo" },
]
keywords = [
    "ai-security",
    "mcp",
    "mcp-security",
    "ai-agent",
    "supply-chain-security",
    "url-monitoring",
    "bait-and-switch",
    "prompt-injection",
    "skill-security",
    "content-monitoring",
    "homoglyph-detection",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Internet :: WWW/HTTP :: Site Management",
    "Typing :: Typed",
]
dependencies = [
    "trafilatura>=2.0,<3",
    "requests>=2.33.0",
    "beautifulsoup4>=4.12",
    # >=6.0.2 is a matrix floor, not a security floor. 6.0 publishes no cp312 or
    # cp313 wheel and fails to build on both; 6.0.1 installs on 3.13 only by
    # compiling from sdist, which needs a toolchain a user may not have. 6.0.2 is
    # the first release shipping wheels across the whole 3.10-3.13 matrix.
    "pyyaml>=6.0.2",
    "confusable_homoglyphs>=3.3",
]

[project.urls]
Homepage = "https://github.com/kuzivaai/SkillWatch"
Repository = "https://github.com/kuzivaai/SkillWatch"
Issues = "https://github.com/kuzivaai/SkillWatch/issues"
Changelog = "https://github.com/kuzivaai/SkillWatch/blob/main/CHANGELOG.md"

[project.scripts]
skillwatch = "skillwatch.cli:main"

[project.optional-dependencies]
# Optional external anchoring (RFC 3161 timestamping). Keeps the core install
# dependency-light and fully offline; only users who want cryptographic
# anchoring need these.
anchor = [
    # >=1.0.6 is a security floor, not a feature floor: every earlier release is
    # affected by CVE-2026-33753 (GHSA-3xxc-pwj6-jgrj), an authorisation bypass
    # that lets an attacker impersonate a pinned timestamp authority — FreeTSA,
    # our default backend, is the advisory's worked example.
    "rfc3161-client>=1.0.6",
    # >=50.0.0 is a security floor, not a feature floor. This floor read >=48.0.1
    # until 2026-08-05, when scripts/audit_dependency_floors.py went red against
    # newly published advisories: every release below 50.0.0 is affected by
    # GHSA-g6cj-pr64-35w5, GHSA-jwv3-5hgf-82ww, GHSA-m2h6-j472-rp4c and
    # PYSEC-2026-3552/3553/3554. The auditor derives the 50.0.0 minimum itself;
    # it is not typed in here by hand.
    "cryptography>=50.0.0",
]
dev = [
    "pytest>=9.0.3",
    # A floor here is load-bearing, not cosmetic: without one the lowest-direct CI
    # leg resolved pytest-cov to 0.6, a 2010 release, and the leg still went green
    # only because it runs pytest without --cov.
    "pytest-cov>=7.1.0",
    "responses>=0.25",
    # Linter and type checker are bounded, not floating. Their *default rule sets*
    # change between minors, so an unpinned tool turns CI into a non-reproducible
    # check that goes red on an upstream release rather than on a code change.
    # ruff 0.16.0 did exactly that: it reports 27 findings on code that was green,
    # none of them regressions. Bumping these bounds is a deliberate, reviewed
    # change (Dependabot will propose it), not a side effect of an unrelated push.
    "ruff>=0.15.21,<0.16",
    "mypy>=2.2,<2.3",
    "types-PyYAML>=6.0.12.20260518",
    "types-requests>=2.33.0.20260518",
    "types-beautifulsoup4>=4.12.0.20250516",
    # scripts/audit_dependency_floors.py reads pyproject.toml; tomllib is stdlib
    # from 3.11, so 3.10 needs the backport to run the audit and its tests.
    "tomli>=2.0.1; python_version < '3.11'",
    # so the anchoring tests run in CI (same security floors as [anchor]):
    "rfc3161-client>=1.0.6",
    "cryptography>=50.0.0",
]

[tool.setuptools.packages.find]
include = ["skillwatch*"]

[tool.setuptools.package-data]
skillwatch = ["data/*.pem"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"
disallow_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
warn_unused_ignores = true
strict_equality = true

[[tool.mypy.overrides]]
module = "confusable_homoglyphs.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "trafilatura.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "rfc3161_client.*"
ignore_missing_imports = true

# mypy is pinned to python_version 3.10, where tomllib is not stdlib. The audit
# script and its test import it with a tomli fallback for exactly that reason.
[[tool.mypy.overrides]]
module = ["tomllib", "tomli"]
ignore_missing_imports = true

[tool.ruff]
target-version = "py310"
line-length = 100
