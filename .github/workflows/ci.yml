name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Why every job that runs pytest sets PYTHONDONTWRITEBYTECODE=1.
#
# CPython decides whether a cached .pyc is still valid by comparing the source
# file's mtime and size against the header it wrote into the cache. Both must
# match. mtime is stored at whole-second granularity, so two edits of a source
# file within the same second that leave the size unchanged are indistinguishable
# from no edit at all, and the stale bytecode is reused.
#
# That is not hypothetical here. A previous session changed a single digit in a
# test (identical size), re-ran within the same second, and read a passing result
# produced by the pre-change bytecode. The apparent conclusion — that the fix was
# unnecessary — was wrong.
#
# Deleting __pycache__ before each run fixes it on one machine and only for as
# long as someone remembers. Setting this variable removes the cache from the
# equation entirely: no .pyc is written, so none can go stale. The cost is a few
# hundred milliseconds of re-compilation per run, which is not worth one more
# false result.
env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7
        with:
          fetch-depth: 0  # history for the fail-before controls
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Lint
        # analysis/ is in scope: measure_efficacy.py produces every published
        # efficacy figure, so it is evidence, not a scratch script.
        run: ruff check skillwatch/ tests/ scripts/ analysis/
      - name: Type check
        # scripts/ is included because the floor audit is now a security gate.
        #
        # The analysis/ scope is DERIVED from git ls-files, not typed out. It used to
        # be a hand-written list of five files; measure_base_rate.py and
        # build_realpage_corpus.py were added 2026-07-29 and sat outside it until
        # 2026-07-30 — a narrower gate than the one CLAUDE.md documented, and the
        # same out-of-scope shape as ledger items 17, 35, 36 and 42. A list you have
        # to remember to extend is that defect waiting for its next outing, so the
        # list is now generated. Only TRACKED files are included: the rest of
        # analysis/ is gitignored scratch, which a bare `mypy analysis/` would try
        # to check. tests/test_ci_scope.py asserts this stays derived.
        run: mypy skillwatch/ scripts/ $(git ls-files 'analysis/*.py')
      - name: Test
        run: pytest --cov=skillwatch --cov-report=term-missing --cov-fail-under=90 -q
      - name: Published figures match the harness
        # Runs the harness and fails if any published surface carries a
        # proportion it does not currently produce. tests/test_figure_rules.py
        # covers the same ground inside pytest; this step exists so the failure
        # is named rather than buried in a test summary.
        run: python3 scripts/figure_rules.py

  # Blocking. SkillWatch is a security tool; it must not ship, or permit a user to
  # resolve, a dependency with a published advisory. Two distinct checks, because
  # they catch different failures:
  #   - pip-audit inspects the versions actually installed here (newest available).
  #   - the floor audit inspects the versions pyproject.toml *permits*, which is
  #     what a downstream user with an older index or a lockfile may resolve to.
  # A vulnerable floor is invisible to pip-audit alone. That gap shipped once
  # already: rfc3161-client>=1.0 permitted CVE-2026-33753 while CI stayed green.
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7
        with:
          fetch-depth: 0  # history for the fail-before controls
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Install dependencies
        # pip-audit is deliberately NOT installed here. It goes in an isolated
        # environment below, so the freeze in the next step is SkillWatch's own
        # dependency closure and not pip-audit's as well. Auditing the auditor's
        # dependencies would let an advisory in cyclonedx or CacheControl fail this
        # project's CI for something this project does not ship.
        run: pip install -e ".[dev]"
      - name: Export the resolved dependency set, excluding the project itself
        # --exclude-editable drops the editable SkillWatch install. That is the whole
        # trick: the project is not in the audited set, so whether the version under
        # test is published stops mattering.
        run: pip freeze --exclude-editable > requirements-audit.txt
      - name: Install pip-audit in an isolated environment
        run: python -m venv /tmp/auditenv && /tmp/auditenv/bin/pip install pip-audit
      - name: Audit resolved dependencies (--strict, no skip flags)
        # --strict was omitted here until 2026-07-30, with a comment asserting it
        # could never pass. That was tested on 2026-07-30 and the strong claim is
        # FALSE: --strict passes on this shape. Measured, both branches:
        #
        #   env scan, version 0.4.1 (published)   pip-audit --strict          -> 0
        #   env scan, version 0.9.9 (unreleased)  pip-audit --strict          -> 1
        #       "skillwatch: Dependency not found on PyPI and could not be audited"
        #   this shape, either version            --strict -r <resolved file> -> 0
        #
        # So the ORIGINAL reasoning was right about the mechanism and wrong about
        # today: the env-scan shape passes at the moment only because main's version
        # happens to equal what PyPI serves, and would fail at the next pre-release
        # bump. This shape is robust because the project is excluded outright.
        #
        # --strict IS load-bearing. Demonstrated 2026-07-30, having been carried for
        # five sessions as an undemonstrated rule. The case: a package pip resolves
        # but PyPI 404s, so it cannot be audited at all.
        #
        #   pip-audit --desc -r <file>            -> exit 0, prints a "Skip Reason"
        #                                            table and PASSES
        #   pip-audit --strict --desc -r <file>   -> exit 1
        #       "skillwatch-strict-probe-does-not-exist: Dependency not found on
        #        PyPI and could not be audited"
        #
        # Without --strict a dependency that was never audited is silently tolerated
        # and this gate reports green: the same fail-open shape as an unparseable
        # specifier treated as satisfied. Reachable here because `pip freeze` names
        # whatever is installed, including anything from a private index, a VCS URL,
        # or a release later removed from PyPI.
        #
        # An earlier note here said no case had been found. That was true of the four
        # cases tried then (resolvable-with-advisories, nonexistent package, yanked
        # release, local sdist of a published version) and false in general.
        #
        # See docs/DEPENDENCY-FLOORS.md for the full record.
        run: /tmp/auditenv/bin/pip-audit --strict --desc -r requirements-audit.txt
      - name: Audit declared dependency floors
        run: python3 scripts/audit_dependency_floors.py

  # Resolve every direct dependency to its declared minimum and run the suite there.
  # This is what proves the floors in pyproject.toml are a configuration that actually
  # works, rather than numbers nobody has executed. uv run (not uv sync) because with
  # a lockfile present `uv sync --resolution lowest-direct` resolves above the declared
  # minimums and would test nothing. See docs/DEPENDENCY-FLOORS.md.
  #
  # Matrixed over every Python the project claims to support, not just the oldest.
  # A floor can be advisory-free, bounded, and still uninstallable on one
  # interpreter: pyyaml>=6.0 published no cp312 or cp313 wheel and failed to build
  # on both, while a 3.10-only leg stayed green. Declaring support for 3.10-3.13
  # means the floor contract has to hold on all four.
  lowest-direct:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7
        with:
          fetch-depth: 0  # history for the fail-before controls
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Install uv
        run: pip install uv
      - name: Test against the lowest declared dependency versions
        # uv fetches the target interpreter itself; the setup-python above only
        # provides a host for uv. --isolated keeps this out of any cached env.
        run: uv run --python ${{ matrix.python-version }} --resolution lowest-direct --isolated --extra dev pytest -q
