name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Why every job that runs pytest sets PYTHONDONTWRITEBYTECODE=1.
#
# CPython decides whether a cached .pyc is still valid by comparing the source
# file's mtime and size against the header it wrote into the cache. Both must
# match. mtime is stored at whole-second granularity, so two edits of a source
# file within the same second that leave the size unchanged are indistinguishable
# from no edit at all, and the stale bytecode is reused.
#
# That is not hypothetical here. A previous session changed a single digit in a
# test (identical size), re-ran within the same second, and read a passing result
# produced by the pre-change bytecode. The apparent conclusion — that the fix was
# unnecessary — was wrong.
#
# Deleting __pycache__ before each run fixes it on one machine and only for as
# long as someone remembers. Setting this variable removes the cache from the
# equation entirely: no .pyc is written, so none can go stale. The cost is a few
# hundred milliseconds of re-compilation per run, which is not worth one more
# false result.
env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Lint
        # analysis/ is in scope: measure_efficacy.py produces every published
        # efficacy figure, so it is evidence, not a scratch script.
        run: ruff check skillwatch/ tests/ scripts/ analysis/
      - name: Type check
        # scripts/ is included because the floor audit is now a security gate.
        # measure_base_rate.py and build_realpage_corpus.py were added 2026-07-29
        # and were outside this scope until 2026-07-30 — a narrower gate than the
        # one CLAUDE.md documented, and the same out-of-scope shape as ledger
        # items 17, 35, 36 and 42. Widened rather than left implicit.
        run: >-
          mypy skillwatch/ scripts/
          analysis/measure_efficacy.py
          analysis/measure_base_rate.py
          analysis/build_realpage_corpus.py
          analysis/run_delta_pass.py
          analysis/make_baseline.py
      - name: Test
        run: pytest --cov=skillwatch --cov-report=term-missing --cov-fail-under=90 -q
      - name: Published figures match the harness
        # Runs the harness and fails if any published surface carries a
        # proportion it does not currently produce. tests/test_figure_rules.py
        # covers the same ground inside pytest; this step exists so the failure
        # is named rather than buried in a test summary.
        run: python3 scripts/figure_rules.py

  # Blocking. SkillWatch is a security tool; it must not ship, or permit a user to
  # resolve, a dependency with a published advisory. Two distinct checks, because
  # they catch different failures:
  #   - pip-audit inspects the versions actually installed here (newest available).
  #   - the floor audit inspects the versions pyproject.toml *permits*, which is
  #     what a downstream user with an older index or a lockfile may resolve to.
  # A vulnerable floor is invisible to pip-audit alone. That gap shipped once
  # already: rfc3161-client>=1.0 permitted CVE-2026-33753 while CI stayed green.
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e ".[dev]" pip-audit
      - name: Audit installed dependencies
        # --strict is omitted because SkillWatch itself is never auditable in its own
        # CI: as an editable install pip-audit reports "distribution marked as
        # editable", and as a regular install it reports "not found on PyPI" (the
        # version under test is unreleased by definition). Both fail --strict, so it
        # would block on the project rather than on any dependency. --skip-editable
        # does not satisfy --strict; it is the skip that --strict rejects.
        run: pip-audit --skip-editable --desc
      - name: Audit declared dependency floors
        run: python3 scripts/audit_dependency_floors.py

  # Resolve every direct dependency to its declared minimum and run the suite there.
  # This is what proves the floors in pyproject.toml are a configuration that actually
  # works, rather than numbers nobody has executed. uv run (not uv sync) because with
  # a lockfile present `uv sync --resolution lowest-direct` resolves above the declared
  # minimums and would test nothing. See docs/DEPENDENCY-FLOORS.md.
  #
  # Matrixed over every Python the project claims to support, not just the oldest.
  # A floor can be advisory-free, bounded, and still uninstallable on one
  # interpreter: pyyaml>=6.0 published no cp312 or cp313 wheel and failed to build
  # on both, while a 3.10-only leg stayed green. Declaring support for 3.10-3.13
  # means the floor contract has to hold on all four.
  lowest-direct:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.12"
      - name: Install uv
        run: pip install uv
      - name: Test against the lowest declared dependency versions
        # uv fetches the target interpreter itself; the setup-python above only
        # provides a host for uv. --isolated keeps this out of any cached env.
        run: uv run --python ${{ matrix.python-version }} --resolution lowest-direct --isolated --extra dev pytest -q
